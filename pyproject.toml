[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-game-training"
version = "0.1.0"
description = "Snake e painel de decisões do Laya"
requires-python = ">=3.13"
dependencies = ["torch==2.14.1", "transformers==5.20.2", "laya==0.4.13", "pygame-ce==2.5.8", "numpy==2.5.4", "pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["nucleo*", "jogos*", "treino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: testes acima de 10s, incluindo reproduções completas e QA de 200 partidas por nível (use --qa-partidas para reduzir o QA)"]

# uv respeita o índice exclusivo do torch; em pip use scripts/instalar.ps1.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
